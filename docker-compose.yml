# PostgreSQL for development, as an alternative to a native install.
#
# The Windows launcher (installer\engine\launcher.ps1) does not use this: it finds an
# existing server or downloads a private one into .postgres\. This file is for
# working on the project on a machine where running Postgres in Docker is
# simpler.
#
# The credentials below are the defaults in apps/backend/.env.example, so
# `docker compose up -d` and that DATABASE_URL line up without editing either.
# A real install generates its own during the setup wizard.
#
# A Redis 7 service used to sit alongside this one. Nothing in the codebase ever
# connected to it — there is no job runner and no broker — so it was removed
# rather than left running and misleading.
#
# The full stack (postgres + app image with API :3001 and portal :3000) runs
# under the `app` profile — `docker compose up` alone stays database-only so a
# plain dev checkout is not surprised by a full image build:
#   docker compose --profile app up --build -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: school-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: school_db
    ports:
      # Loopback only: a school LAN shares wifi with students' devices, and the
      # documented default password below must never sit on a routable
      # interface. The backend reaches it over 127.0.0.1 like any native install.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_user -d school_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    profiles: ["app"]
    build: .
    container_name: school-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Host `postgres` is this file's service above, not localhost.
      DATABASE_URL: postgresql://school_user:change_me@postgres:5432/school_db
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      # Local pg_dump safety nets (see docker-entrypoint.sh) survive recreation.
      - app_backups:/app/backups
      # No machine-id on Alpine: the generated machine key that wraps the
      # cloud-backup credentials must be volumed or it is unrecoverable
      # after a recreate (see BACKUP.md).
      - app_cloud_creds:/app/.cloud-creds

volumes:
  postgres_data:
  app_backups:
  app_cloud_creds:
