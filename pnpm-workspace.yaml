packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks build scripts by default. @nestjs/core needs its postinstall so that
# its @swc/core native dependency also compiles on a cold machine.
# Note: this only covers direct workspace dependencies. For transitive deps like
# @swc/core (nested under @nestjs/core), users must also run `pnpm approve-builds`
# interactively on first pull — the approval is stored per-machine.
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@swc/core"
