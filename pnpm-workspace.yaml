packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks build scripts by default. @nestjs/core needs its postinstall so that
# its @swc/core native dependency also compiles on a cold machine.
# @mongodb-js/zstd carries the native zstd binding behind cloud-backup
# compression: without approval every install silently falls back to gzip.
# Committed here (not per-machine) so fresh installs, updates and dev
# checkouts all build the same binaries with zero interactive steps.
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@swc/core"
  - "@mongodb-js/zstd"
